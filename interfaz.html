<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Master Control - elriveratv</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Oswald:wght@500&display=swap');

        :root {
            --bg: #0f111a;
            --card: #1c1f2b;
            --primary: #4A148C;
            --accent: #E91E63;
            --green: #00e676;
            --text: #ffffff;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .dashboard {
            max-width: 900px;
            width: 100%;
        }

        .main-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--primary);
            padding-bottom: 15px;
            margin-bottom: 30px;
        }

        .main-header h1 {
            font-family: 'Oswald', sans-serif;
            margin: 0;
            letter-spacing: 2px;
            color: var(--accent);
        }

        /* --- RELOJ DE REFERENCIA PARA EL OPERADOR --- */
        .reference-clock {
            text-align: right;
            font-family: 'Oswald', sans-serif;
        }
        #ref-time { font-size: 1.4rem; color: var(--text); display: block; line-height: 1; }
        #ref-date { font-size: 0.75rem; color: #aaa; text-transform: uppercase; margin-top: 5px; display: block; }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
        }

        .module-card {
            background: var(--card);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.05);
            transition: transform 0.3s ease;
        }

        .module-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .module-title {
            font-weight: 700;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #aaa;
        }

        /* --- SWITCHES --- */
        .switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 26px;
        }

        .switch input { opacity: 0; width: 0; height: 0; }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #333;
            transition: .4s;
            border-radius: 34px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px; width: 18px;
            left: 4px; bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .slider { background-color: var(--green); }
        input:checked + .slider:before { transform: translateX(24px); }

        .input-group { margin-top: 15px; }

        label {
            display: block;
            font-size: 0.7rem;
            margin-bottom: 5px;
            color: var(--accent);
            font-weight: bold;
        }

        input[type="text"], input[type="color"], textarea {
            width: 100%;
            background: #0f111a;
            border: 1px solid #333;
            color: white;
            padding: 10px;
            border-radius: 8px;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
        }

        textarea { height: 60px; resize: none; }

        input[type="color"] {
            height: 45px;
            cursor: pointer;
            padding: 5px;
        }

        .color-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            margin-top: 10px;
        }

        .action-btn {
            width: 100%;
            margin-top: 15px;
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 0.8rem;
        }

        .control-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0,0,0,0.2);
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 8px;
        }

        .control-label { font-size: 0.85rem; font-weight: 600; }

    </style>
</head>
<body>

<div class="dashboard">
    <div class="main-header">
        <div>
            <h1>ELRIVERATV <span style="font-weight: 300; font-size: 0.9rem; color: white;">PRO BROADCAST</span></h1>
            <div id="live-status"><span style="height:10px; width:10px; border-radius:50%; display:inline-block; margin-right:5px; background:var(--green);"></span> ONLINE</div>
        </div>
        <div class="reference-clock">
            <span id="ref-time">00:00:00</span>
            <span id="ref-date">CARGANDO...</span>
        </div>
    </div>

    <div class="grid">
        <div class="module-card">
            <div class="module-header">
                <span class="module-title">🔘 Marcador Superior</span>
                <label class="switch">
                    <input type="checkbox" id="checkLive" onchange="toggle('showLive', this.checked)">
                    <span class="slider"></span>
                </label>
            </div>
            <div class="control-row">
                <span class="control-label">Mostrar Ubicación</span>
                <label class="switch" style="transform: scale(0.8);">
                    <input type="checkbox" id="checkLocation" onchange="toggle('showLocation', this.checked)">
                    <span class="slider"></span>
                </label>
            </div>
            <div class="input-group">
                <label>UBICACIÓN DEL STREAM</label>
                <input type="text" id="inputLoc" placeholder="Ej: Tepic, Nayarit" onkeyup="updateText('location', this.value)">
            </div>
        </div>

        <div class="module-card">
            <div class="module-header">
                <span class="module-title">🆔 Identidad de Marca</span>
            </div>
            <div class="control-row">
                <span class="control-label">Logo ELRIVERATV</span>
                <label class="switch"><input type="checkbox" id="checkBrand" onchange="toggle('showBrand', this.checked)"><span class="slider"></span></label>
            </div>
            <div class="control-row">
                <span class="control-label">Fecha en Pantalla</span>
                <label class="switch"><input type="checkbox" id="checkClock" onchange="toggle('showClock', this.checked)"><span class="slider"></span></label>
            </div>
            <div class="control-row">
                <span class="control-label">Reloj (Bebas Neue)</span>
                <label class="switch"><input type="checkbox" id="checkTime" onchange="toggle('showTime', this.checked)"><span class="slider"></span></label>
            </div>
            <div class="control-row">
                <span class="control-label">Temperatura Actual</span>
                <label class="switch"><input type="checkbox" id="checkTemp" onchange="toggle('showTemp', this.checked)"><span class="slider"></span></label>
            </div>
        </div>

        <div class="module-card">
            <div class="module-header">
                <span class="module-title">👤 Lower Third (Invitado)</span>
                <label class="switch"><input type="checkbox" id="checkLT" onchange="toggle('showLowerThird', this.checked)"><span class="slider"></span></label>
            </div>
            <div class="input-group">
                <label>NOMBRE PRINCIPAL</label>
                <input type="text" id="inputLTMain" onkeyup="updateText('ltMain', this.value)">
            </div>
            <div class="input-group">
                <label>DESCRIPCIÓN / CARGO</label>
                <input type="text" id="inputLTSub" onkeyup="updateText('ltSub', this.value)">
            </div>
        </div>

        <div class="module-card">
            <div class="module-header">
                <span class="module-title">🔳 Info Center Centrado</span>
                <label class="switch">
                    <input type="checkbox" id="checkInfoCenter" onchange="toggle('showInfoCenter', this.checked)">
                    <span class="slider"></span>
                </label>
            </div>
            <div class="input-group">
                <label>TÍTULO DEL CUADRO</label>
                <input type="text" id="inputInfoTitle" placeholder="Ej: ¿Sabías que...?" onkeyup="updateText('infoTitle', this.value)">
            </div>
            <div class="input-group">
                <label>CONTENIDO / INFORMACIÓN</label>
                <textarea id="inputInfoBody" placeholder="Escribe la información aquí..." onkeyup="updateText('infoBody', this.value)"></textarea>
            </div>
        </div>

        <div class="module-card">
            <div class="module-header">
                <span class="module-title">🎨 Colores de Interfaz</span>
            </div>
            <div class="color-grid">
                <div class="input-group">
                    <label>PRIMARIO</label>
                    <input type="color" id="colorPrimary" onchange="updateText('colorPrimary', this.value)">
                </div>
                <div class="input-group">
                    <label>ACENTO</label>
                    <input type="color" id="colorAccent" onchange="updateText('colorAccent', this.value)">
                </div>
                <div class="input-group">
                    <label>RESALTADO</label>
                    <input type="color" id="colorHighlight" onchange="updateText('colorHighlight', this.value)">
                </div>
            </div>
        </div>

        <div class="module-card">
            <div class="module-header">
                <span class="module-title">🎞️ Solo Ticker (Noticias)</span>
                <label class="switch"><input type="checkbox" id="checkWeather" onchange="toggle('showWeather', this.checked)"><span class="slider"></span></label>
            </div>
            <div class="input-group">
                <label>TEXTO DE MARQUESINA</label>
                <input type="text" id="inputNews" onkeyup="updateText('weatherText', this.value)">
            </div>
        </div>

        <div class="module-card">
            <div class="module-header">
                <span class="module-title">⚙️ Sistema</span>
            </div>
            <button class="action-btn" style="background: #333;" onclick="localStorage.clear(); location.reload();">Resetear Panel</button>
        </div>
    </div>
</div>

<script>
    // Lógica del Reloj de Referencia (Se mantiene igual)
    function updateRefClock() {
        const now = new Date();
        document.getElementById('ref-time').innerText = now.toLocaleTimeString('es-MX', { hour12: false });
        document.getElementById('ref-date').innerText = now.toLocaleDateString('es-MX', { weekday: 'long', day: 'numeric', month: 'long' });
    }
    setInterval(updateRefClock, 1000);
    updateRefClock();

    // FUNCIÓN CORREGIDA: Ahora asegura el envío de strings 'true'/'false'
    function toggle(key, isChecked) {
        localStorage.setItem(key, isChecked ? 'true' : 'false');
        window.dispatchEvent(new Event('storage'));
    }

    function updateText(key, value) {
        localStorage.setItem(key, value);
        window.dispatchEvent(new Event('storage'));
    }

    window.onload = () => {
        // Carga de switches con lógica de comparación de strings
        document.getElementById('checkLive').checked = localStorage.getItem('showLive') !== 'false';
        document.getElementById('checkLocation').checked = localStorage.getItem('showLocation') !== 'false';
        document.getElementById('checkBrand').checked = localStorage.getItem('showBrand') !== 'false';
        document.getElementById('checkClock').checked = localStorage.getItem('showClock') !== 'false';
        document.getElementById('checkTime').checked = localStorage.getItem('showTime') !== 'false';
        document.getElementById('checkTemp').checked = localStorage.getItem('showTemp') !== 'false';
        
        // Corrección específica para Lower Third e Info Center
        document.getElementById('checkLT').checked = localStorage.getItem('showLowerThird') === 'true';
        document.getElementById('checkWeather').checked = localStorage.getItem('showWeather') !== 'false';
        document.getElementById('checkInfoCenter').checked = localStorage.getItem('showInfoCenter') === 'true';
        
        // Carga de Textos
        document.getElementById('inputLoc').value = localStorage.getItem('location') || "";
        document.getElementById('inputNews').value = localStorage.getItem('weatherText') || "";
        document.getElementById('inputLTMain').value = localStorage.getItem('ltMain') || "";
        document.getElementById('inputLTSub').value = localStorage.getItem('ltSub') || "";
        document.getElementById('inputInfoTitle').value = localStorage.getItem('infoTitle') || "";
        document.getElementById('inputInfoBody').value = localStorage.getItem('infoBody') || "";

        // Carga de Colores
        document.getElementById('colorPrimary').value = localStorage.getItem('colorPrimary') || "#4A148C";
        document.getElementById('colorAccent').value = localStorage.getItem('colorAccent') || "#E91E63";
        document.getElementById('colorHighlight').value = localStorage.getItem('colorHighlight') || "#00E5FF";
    }
</script>

</body>
</html>
