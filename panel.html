<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Master Control - elriveratv</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Oswald:wght@500&display=swap');

        :root {
            --bg: #0f111a;
            --card: #1c1f2b;
            --primary: #4A148C;
            --accent: #E91E63;
            --green: #00e676;
            --text: #ffffff;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .dashboard {
            max-width: 900px;
            width: 100%;
        }

        .main-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--primary);
            padding-bottom: 15px;
            margin-bottom: 30px;
        }

        .main-header h1 {
            font-family: 'Oswald', sans-serif;
            margin: 0;
            letter-spacing: 2px;
            color: var(--accent);
        }

        .reference-clock {
            text-align: right;
            font-family: 'Oswald', sans-serif;
        }
        #ref-time { font-size: 1.4rem; color: var(--text); display: block; line-height: 1; }
        #ref-date { font-size: 0.75rem; color: #aaa; text-transform: uppercase; margin-top: 5px; display: block; }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
        }

        .module-card {
            background: var(--card);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.05);
        }

        .module-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .module-title {
            font-weight: 700;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #aaa;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 26px;
        }

        .switch input { opacity: 0; width: 0; height: 0; }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #333;
            transition: .4s;
            border-radius: 34px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px; width: 18px;
            left: 4px; bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .slider { background-color: var(--green); }
        input:checked + .slider:before { transform: translateX(24px); }

        .input-group { margin-top: 15px; }

        label {
            display: block;
            font-size: 0.7rem;
            margin-bottom: 5px;
            color: var(--accent);
            font-weight: bold;
        }

        input[type="text"], input[type="color"], textarea {
            width: 100%;
            background: #0f111a;
            border: 1px solid #333;
            color: white;
            padding: 10px;
            border-radius: 8px;
            box-sizing: border-box;
        }

        textarea { height: 60px; resize: none; }

        .control-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0,0,0,0.2);
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 8px;
        }

        .control-label { font-size: 0.85rem; font-weight: 600; }

        .action-btn {
            width: 100%;
            margin-top: 15px;
            background: #333;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="dashboard">
    <div class="main-header">
        <h1>ELRIVERATV <span style="font-weight: 300; font-size: 0.9rem; color: white;">MASTER CONTROL</span></h1>
        <div class="reference-clock">
            <span id="ref-time">00:00:00</span>
            <span id="ref-date">FECHA</span>
        </div>
    </div>

    <div class="grid">
        <div class="module-card">
            <div class="module-header">
                <span class="module-title">🔘 Marcador Superior</span>
                <label class="switch">
                    <input type="checkbox" id="checkLive" onchange="updateFirebase('showLive', this.checked)">
                    <span class="slider"></span>
                </label>
            </div>
            <div class="control-row">
                <span class="control-label">Ubicación</span>
                <label class="switch">
                    <input type="checkbox" id="checkLocation" onchange="updateFirebase('showLocation', this.checked)">
                    <span class="slider"></span>
                </label>
            </div>
            <div class="input-group">
                <label>CIUDAD / PAÍS</label>
                <input type="text" id="inputLoc" onkeyup="updateFirebase('location', this.value)">
            </div>
        </div>

        <div class="module-card">
            <div class="module-header"><span class="module-title">🆔 Identidad</span></div>
            <div class="control-row">
                <span class="control-label">Logo / Brand</span>
                <label class="switch"><input type="checkbox" id="checkBrand" onchange="updateFirebase('showBrand', this.checked)"><span class="slider"></span></label>
            </div>
            <div class="control-row">
                <span class="control-label">Reloj Digital</span>
                <label class="switch"><input type="checkbox" id="checkTime" onchange="updateFirebase('showTime', this.checked)"><span class="slider"></span></label>
            </div>
            <div class="control-row">
                <span class="control-label">Fecha Larga</span>
                <label class="switch"><input type="checkbox" id="checkClock" onchange="updateFirebase('showClock', this.checked)"><span class="slider"></span></label>
            </div>
        </div>

        <div class="module-card">
            <div class="module-header">
                <span class="module-title">👤 Invitado (Lower Third)</span>
                <label class="switch"><input type="checkbox" id="checkLT" onchange="updateFirebase('showLowerThird', this.checked)"><span class="slider"></span></label>
            </div>
            <div class="input-group">
                <label>NOMBRE</label>
                <input type="text" id="inputLTMain" onkeyup="updateFirebase('ltMain', this.value)">
            </div>
            <div class="input-group">
                <label>CARGO / REDES</label>
                <input type="text" id="inputLTSub" onkeyup="updateFirebase('ltSub', this.value)">
            </div>
        </div>

        <div class="module-card">
            <div class="module-header">
                <span class="module-title">🔳 Info Center</span>
                <label class="switch"><input type="checkbox" id="checkInfoCenter" onchange="updateFirebase('showInfoCenter', this.checked)"><span class="slider"></span></label>
            </div>
            <div class="input-group">
                <label>TÍTULO</label>
                <input type="text" id="inputInfoTitle" onkeyup="updateFirebase('infoTitle', this.value)">
            </div>
            <div class="input-group">
                <label>CONTENIDO</label>
                <textarea id="inputInfoBody" onkeyup="updateFirebase('infoBody', this.value)"></textarea>
            </div>
        </div>

        <div class="module-card">
            <div class="module-header"><span class="module-title">🎨 Colores</span></div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <div>
                    <label>PRIMARIO</label>
                    <input type="color" id="colorPrimary" onchange="updateFirebase('colorPrimary', this.value)">
                </div>
                <div>
                    <label>ACENTO</label>
                    <input type="color" id="colorAccent" onchange="updateFirebase('colorAccent', this.value)">
                </div>
            </div>
        </div>

        <div class="module-card">
            <div class="module-header">
                <span class="module-title">🎞️ Ticker (Noticias)</span>
                <label class="switch"><input type="checkbox" id="checkWeather" onchange="updateFirebase('showWeather', this.checked)"><span class="slider"></span></label>
            </div>
            <div class="input-group">
                <label>TEXTO CORREDIZO</label>
                <input type="text" id="inputNews" onkeyup="updateFirebase('weatherText', this.value)">
            </div>
            <button class="action-btn" onclick="if(confirm('¿Reiniciar todo?')) db.set({});">Resetear Sistema</button>
        </div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

<script>
    const firebaseConfig = { databaseURL: "TU_URL_DE_FIREBASE_AQUI" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database().ref('overlayData');

    function updateFirebase(key, value) {
        let val = value;
        if(typeof value === 'boolean') val = value ? 'true' : 'false';
        db.update({ [key]: val });
    }

    // Sincronizar el panel con los datos actuales de Firebase
    db.on('value', (snapshot) => {
        const data = snapshot.val() || {};
        
        document.getElementById('checkLive').checked = data.showLive !== 'false';
        document.getElementById('checkLocation').checked = data.showLocation !== 'false';
        document.getElementById('checkBrand').checked = data.showBrand !== 'false';
        document.getElementById('checkTime').checked = data.showTime !== 'false';
        document.getElementById('checkClock').checked = data.showClock !== 'false';
        document.getElementById('checkLT').checked = data.showLowerThird === 'true';
        document.getElementById('checkInfoCenter').checked = data.showInfoCenter === 'true';
        document.getElementById('checkWeather').checked = data.showWeather !== 'false';

        document.getElementById('inputLoc').value = data.location || "";
        document.getElementById('inputLTMain').value = data.ltMain || "";
        document.getElementById('inputLTSub').value = data.ltSub || "";
        document.getElementById('inputInfoTitle').value = data.infoTitle || "";
        document.getElementById('inputInfoBody').value = data.infoBody || "";
        document.getElementById('inputNews').value = data.weatherText || "";
        document.getElementById('colorPrimary').value = data.colorPrimary || "#4A148C";
        document.getElementById('colorAccent').value = data.colorAccent || "#E91E63";
    });

    setInterval(() => {
        const now = new Date();
        document.getElementById('ref-time').innerText = now.toLocaleTimeString('es-MX', { hour12: false });
        document.getElementById('ref-date').innerText = now.toLocaleDateString('es-MX', { weekday: 'long', day: 'numeric', month: 'long' });
    }, 1000);
</script>
</body>
</html>
