<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Broadcast Switcher PRO - elriveratv</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Oswald:wght@500;700&display=swap');

        :root {
            --bg: #0b0d14;
            --card: #161925;
            --primary: #4A148C;
            --accent: #E91E63;
            --green: #00ff88;
            --text: #ffffff;
            --panel-border: #2d3142;
        }

        body { background-color: var(--bg); color: var(--text); font-family: 'Montserrat', sans-serif; margin: 0; padding: 20px; overflow-x: hidden; }
        .dashboard { max-width: 1100px; margin: 0 auto; }
        
        .main-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid var(--primary); padding-bottom: 10px; margin-bottom: 20px; }
        .main-header h1 { font-family: 'Oswald', sans-serif; margin: 0; letter-spacing: 2px; color: var(--accent); }
        
        .header-controls { display: flex; align-items: center; gap: 20px; }
        .btn-settings { 
            background: var(--card); border: 1px solid var(--panel-border); color: white; 
            padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 0.8rem;
            transition: 0.3s;
        }
        .btn-settings:hover { background: var(--primary); border-color: var(--green); }

        .reference-clock { text-align: right; font-family: 'Oswald', sans-serif; }
        #ref-time { font-size: 1.6rem; color: #fff; line-height: 1; }
        #ref-date { font-size: 0.8rem; color: #888; text-transform: uppercase; margin-top: 4px; display: block; }

        /* --- SWITCHER GRID --- */
        .switcher-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); 
            gap: 15px; background: #11141f; padding: 25px; border-radius: 12px; 
            border: 2px solid var(--panel-border); margin-bottom: 30px;
            box-shadow: inset 0 0 30px rgba(0,0,0,0.7);
        }

        .sw-unit { display: flex; flex-direction: column; align-items: center; gap: 12px; }
        .sw-label { font-size: 0.55rem; font-weight: 700; text-transform: uppercase; color: #888; text-align: center; letter-spacing: 1px; height: 20px; }

        .sw-btn {
            width: 70px; height: 70px;
            background: linear-gradient(145deg, #333847, #1a1d26);
            border: 3px solid #111; border-radius: 10px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s; box-shadow: 4px 4px 10px rgba(0,0,0,0.5);
        }

        .sw-led { width: 12px; height: 12px; background: #400; border-radius: 50%; border: 1px solid #000; transition: all 0.3s; }
        .sw-btn.active { border-color: var(--green); }
        .sw-btn.active .sw-led { background: var(--green); box-shadow: 0 0 10px var(--green); }

        /* --- EDITOR SECTION --- */
        .editor-section { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
        .edit-card { background: var(--card); padding: 20px; border-radius: 8px; border: 1px solid var(--panel-border); }
        .edit-card h3 { font-size: 0.75rem; margin: 0 0 15px 0; color: var(--accent); text-transform: uppercase; border-bottom: 1px solid #2d3142; padding-bottom: 5px; }

        label { display: block; font-size: 0.6rem; margin: 10px 0 5px 0; color: #888; font-weight: bold; }
        input[type="text"], input[type="color"], input[type="range"], textarea { 
            width: 100%; background: #090b10; border: 1px solid #333; color: #fff; padding: 8px; 
            border-radius: 5px; box-sizing: border-box; font-family: inherit; font-size: 0.8rem; 
        }
        textarea { height: 50px; resize: none; }

        /* --- MODAL AJUSTES GRANULAR --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); display: none; justify-content: center; align-items: center;
            z-index: 1000; backdrop-filter: blur(10px);
        }
        .modal-content {
            background: var(--card); width: 95%; max-width: 900px; padding: 30px;
            border-radius: 15px; border: 2px solid var(--primary);
            max-height: 90vh; overflow-y: auto;
        }
        .settings-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px; }
        .setting-group { background: #0b0d14; padding: 15px; border-radius: 8px; border: 1px solid #222; }
        .setting-group h4 { margin: 0 0 10px 0; font-size: 0.75rem; color: var(--green); text-transform: uppercase; border-bottom: 1px solid #333; padding-bottom: 5px; }
        
        .control-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; align-items: center; margin-bottom: 5px; }
    </style>
</head>
<body>

<div class="dashboard">
    <div class="main-header">
        <h1>ELRIVERATV <span style="font-weight: 300; font-size: 0.8rem; color: #888;">MASTER SWITCHER</span></h1>
        <div class="header-controls">
            <button class="btn-settings" onclick="openModal()">⚙️ ESTILOS AVANZADOS</button>
            <div class="reference-clock">
                <span id="ref-time">00:00:00 AM</span>
                <span id="ref-date">FECHA</span>
            </div>
        </div>
    </div>

    <div class="switcher-grid">
        <div class="sw-unit"><span class="sw-label">LIVE BADGE</span><button class="sw-btn" id="btn-showLive" onclick="toggleBtn('showLive')"><div class="sw-led"></div></button></div>
        <div class="sw-unit"><span class="sw-label">LOCATION</span><button class="sw-btn" id="btn-showLocation" onclick="toggleBtn('showLocation')"><div class="sw-led"></div></button></div>
        <div class="sw-unit"><span class="sw-label">TEMPERATURE</span><button class="sw-btn" id="btn-showTemp" onclick="toggleBtn('showTemp')"><div class="sw-led"></div></button></div>
        <div class="sw-unit"><span class="sw-label">LOWER THIRD</span><button class="sw-btn" id="btn-showLowerThird" onclick="toggleBtn('showLowerThird')"><div class="sw-led"></div></button></div>
        <div class="sw-unit"><span class="sw-label">INFO CENTER</span><button class="sw-btn" id="btn-showInfoCenter" onclick="toggleBtn('showInfoCenter')"><div class="sw-led"></div></button></div>
        <div class="sw-unit"><span class="sw-label">BRAND LOGO</span><button class="sw-btn" id="btn-showBrand" onclick="toggleBtn('showBrand')"><div class="sw-led"></div></button></div>
        <div class="sw-unit"><span class="sw-label">CLOCK / DATE</span><button class="sw-btn" id="btn-showTime" onclick="toggleBtn('showTime')"><div class="sw-led"></div></button></div>
        <div class="sw-unit"><span class="sw-label">TICKER BAR</span><button class="sw-btn" id="btn-showWeather" onclick="toggleBtn('showWeather')"><div class="sw-led"></div></button></div>
    </div>

    <div class="editor-section">
        <div class="edit-card">
            <h3>Textos</h3>
            <label>UBICACIÓN</label><input type="text" id="inputLoc" onkeyup="send('location', this.value)">
            <label>L3: NOMBRE</label><input type="text" id="inputLTMain" onkeyup="send('ltMain', this.value)">
            <label>L3: DESCRIPCIÓN</label><input type="text" id="inputLTSub" onkeyup="send('ltSub', this.value)">
        </div>
        <div class="edit-card">
            <h3>Info Center</h3>
            <label>TÍTULO</label><input type="text" id="inputInfoTitle" onkeyup="send('infoTitle', this.value)">
            <label>CUERPO</label><textarea id="inputInfoBody" onkeyup="send('infoBody', this.value)"></textarea>
        </div>
        <div class="edit-card">
            <h3>Ticker & Colores Base</h3>
            <label>NOTICIAS</label><textarea id="inputNews" oninput="send('weatherText', this.value)"></textarea>
            <div class="control-row">
                <div><label>PRIMARIO</label><input type="color" id="colorPrimary" onchange="send('colorPrimary', this.value)"></div>
                <div><label>ACENTO</label><input type="color" id="colorAccent" onchange="send('colorAccent', this.value)"></div>
            </div>
        </div>
    </div>
</div>

<div class="modal-overlay" id="settingsModal">
    <div class="modal-content">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
            <h2 style="font-family: Oswald; color: var(--accent); margin:0;">ESTILOS INDEPENDIENTES</h2>
            <span style="color:white; font-size:2rem; cursor:pointer;" onclick="closeModal()">&times;</span>
        </div>

        <div class="settings-grid">
            <div class="setting-group">
                <h4>Lower Third (L3)</h4>
                <div class="control-row">
                    <div><label>Fondo</label><input type="color" id="bgLT" onchange="send('bgLT', this.value)"></div>
                    <div><label>Texto</label><input type="color" id="colorTextLT" onchange="send('colorTextLT', this.value)"></div>
                </div>
                <label>Opacidad</label><input type="range" min="0" max="100" id="opLT" oninput="send('opLT', this.value/100)">
                <label>Tamaño Nombre</label><input type="range" min="15" max="70" id="sizeLTMain" oninput="send('sizeLTMain', this.value)">
            </div>

            <div class="setting-group">
                <h4>Info Center</h4>
                <div class="control-row">
                    <div><label>Fondo</label><input type="color" id="bgInfo" onchange="send('bgInfo', this.value)"></div>
                    <div><label>Título</label><input type="color" id="colorTextInfo" onchange="send('colorTextInfo', this.value)"></div>
                </div>
                <label>Opacidad</label><input type="range" min="0" max="100" id="opInfo" oninput="send('opInfo', this.value/100)">
                <label>Tamaño Título</label><input type="range" min="15" max="60" id="sizeInfoTitle" oninput="send('sizeInfoTitle', this.value)">
            </div>

            <div class="setting-group">
                <h4>Ticker (Barra Inferior)</h4>
                <div class="control-row">
                    <div><label>Fondo</label><input type="color" id="bgTicker" onchange="send('bgTicker', this.value)"></div>
                    <div><label>Texto</label><input type="color" id="colorTextTicker" onchange="send('colorTextTicker', this.value)"></div>
                </div>
                <label>Opacidad</label><input type="range" min="0" max="100" id="opTicker" oninput="send('opTicker', this.value/100)">
                <label>Tamaño Fuente</label><input type="range" min="10" max="40" id="sizeTicker" oninput="send('sizeTicker', this.value)">
                <label>Velocidad (Segs)</label><input type="range" min="5" max="60" id="tickerSpeed" oninput="send('tickerSpeed', this.value)">
            </div>

            <div class="setting-group">
                <h4>Reloj & Brand</h4>
                <div class="control-row">
                    <div><label>Fondo Reloj</label><input type="color" id="bgClock" onchange="send('bgClock', this.value)"></div>
                    <div><label>Texto Reloj</label><input type="color" id="colorTextClock" onchange="send('colorTextClock', this.value)"></div>
                </div>
                <label>Tamaño Hora</label><input type="range" min="20" max="60" id="sizeClock" oninput="send('sizeClock', this.value)">
                <label>Opacidad Reloj</label><input type="range" min="0" max="100" id="opClock" oninput="send('opClock', this.value/100)">
            </div>
        </div>
        <button class="btn-settings" style="width:100%; margin-top:20px; padding:15px;" onclick="closeModal()">APLICAR CAMBIOS</button>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

<script>
    const firebaseConfig = { databaseURL: "https://elriveratv-28c69-default-rtdb.firebaseio.com/" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database().ref('overlayData');

    let currentStates = {};

    function send(key, value) { db.update({ [key]: value }); }
    function toggleBtn(key) {
        const newState = currentStates[key] === 'true' ? 'false' : 'true';
        db.update({ [key]: newState });
    }
    function openModal() { document.getElementById('settingsModal').style.display = 'flex'; }
    function closeModal() { document.getElementById('settingsModal').style.display = 'none'; }

    db.on('value', (snapshot) => {
        const data = snapshot.val() || {};
        currentStates = data;

        // Actualizar Switches
        const keys = ['showLive','showLocation','showTemp','showLowerThird','showInfoCenter','showBrand','showTime','showWeather'];
        keys.forEach(k => updateBtnUI(k, data[k] !== 'false' && data[k] !== undefined));
        // Caso especial Lower Third e Info Center suelen venir por defecto en false
        updateBtnUI('showLowerThird', data.showLowerThird === 'true');
        updateBtnUI('showInfoCenter', data.showInfoCenter === 'true');

        // Sincronizar Inputs Texto
        document.getElementById('inputLoc').value = data.location || "";
        document.getElementById('inputLTMain').value = data.ltMain || "";
        document.getElementById('inputLTSub').value = data.ltSub || "";
        document.getElementById('inputInfoTitle').value = data.infoTitle || "";
        document.getElementById('inputInfoBody').value = data.infoBody || "";
        document.getElementById('inputNews').value = data.weatherText || "";

        // Sincronizar Colores y Sliders del Modal
        const colorIds = ['colorPrimary','colorAccent','bgLT','colorTextLT','bgInfo','colorTextInfo','bgTicker','colorTextTicker','bgClock','colorTextClock'];
        colorIds.forEach(id => { if(data[id]) document.getElementById(id).value = data[id]; });

        const rangeIds = ['sizeLTMain','sizeInfoTitle','sizeTicker','sizeClock','tickerSpeed'];
        rangeIds.forEach(id => { if(data[id]) document.getElementById(id).value = data[id]; });

        if(data.opLT) document.getElementById('opLT').value = data.opLT * 100;
        if(data.opInfo) document.getElementById('opInfo').value = data.opInfo * 100;
        if(data.opTicker) document.getElementById('opTicker').value = data.opTicker * 100;
        if(data.opClock) document.getElementById('opClock').value = data.opClock * 100;
    });

    function updateBtnUI(id, isActive) {
        const btn = document.getElementById('btn-' + id);
        if (btn) {
            if (isActive) btn.classList.add('active');
            else btn.classList.remove('active');
        }
    }

    function updateReference() {
        const now = new Date();
        document.getElementById('ref-time').innerText = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true }).toUpperCase();
        document.getElementById('ref-date').innerText = now.toLocaleDateString('es-MX', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }).toUpperCase();
    }
    setInterval(updateReference, 1000);
    updateReference();
</script>
</body>
</html>
