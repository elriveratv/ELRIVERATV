<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Broadcast Switcher - elriveratv</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Oswald:wght@500;700&display=swap');

        :root {
            --bg: #0b0d14;
            --card: #161925;
            --primary: #4A148C;
            --accent: #E91E63;
            --green: #00ff88;
            --text: #ffffff;
            --panel-border: #2d3142;
        }

        body { background-color: var(--bg); color: var(--text); font-family: 'Montserrat', sans-serif; margin: 0; padding: 20px; }
        .dashboard { max-width: 1000px; margin: 0 auto; }
        
        .main-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid var(--primary); padding-bottom: 10px; margin-bottom: 20px; }
        .main-header h1 { font-family: 'Oswald', sans-serif; margin: 0; letter-spacing: 2px; color: var(--accent); }
        
        .reference-clock { text-align: right; font-family: 'Oswald', sans-serif; }
        #ref-time { font-size: 1.6rem; color: #fff; line-height: 1; }
        #ref-date { font-size: 0.8rem; color: #888; text-transform: uppercase; margin-top: 4px; display: block; }

        /* --- SECCIÓN SWITCHER (BOTONES CUADRADOS) --- */
        .switcher-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); 
            gap: 15px; 
            background: #11141f; 
            padding: 25px; 
            border-radius: 12px; 
            border: 2px solid var(--panel-border);
            margin-bottom: 30px;
            box-shadow: inset 0 0 30px rgba(0,0,0,0.7);
        }

        .sw-unit { display: flex; flex-direction: column; align-items: center; gap: 12px; }
        .sw-label { font-size: 0.6rem; font-weight: 700; text-transform: uppercase; color: #666; text-align: center; letter-spacing: 1px; }

        .sw-btn {
            width: 80px; height: 80px;
            background: linear-gradient(145deg, #333847, #1a1d26);
            border: 3px solid #111;
            border-radius: 10px;
            cursor: pointer;
            position: relative;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s;
            box-shadow: 4px 4px 10px rgba(0,0,0,0.5), inset 1px 1px 2px rgba(255,255,255,0.1);
        }

        .sw-led { width: 12px; height: 12px; background: #400; border-radius: 50%; border: 1px solid #000; transition: all 0.3s; }

        .sw-btn.active { border-color: var(--green); box-shadow: 0 0 15px rgba(0, 255, 136, 0.2); }
        .sw-btn.active .sw-led { background: var(--green); box-shadow: 0 0 10px var(--green), 0 0 20px var(--green); }

        /* --- SECCIÓN EDITOR --- */
        .editor-section { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
        .edit-card { background: var(--card); padding: 20px; border-radius: 8px; border: 1px solid var(--panel-border); }
        .edit-card h3 { font-size: 0.75rem; margin: 0 0 15px 0; color: var(--accent); text-transform: uppercase; border-bottom: 1px solid #2d3142; padding-bottom: 5px; }

        label { display: block; font-size: 0.6rem; margin: 10px 0 5px 0; color: #888; font-weight: bold; }
        input[type="text"], input[type="color"], textarea { 
            width: 100%; background: #090b10; border: 1px solid #333; color: #fff; padding: 10px; 
            border-radius: 5px; box-sizing: border-box; font-family: inherit; font-size: 0.85rem; 
        }
        
        /* Auto-ajuste para marquesina */
        #inputNews { 
            min-height: 45px;
            overflow-y: hidden; 
            resize: none; 
            transition: height 0.2s ease;
        }

        textarea { height: 60px; resize: none; }
        .color-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    </style>
</head>
<body>

<div class="dashboard">
    <div class="main-header">
        <h1>ELRIVERATV <span style="font-weight: 300; font-size: 0.8rem; color: #888;">MASTER SWITCHER</span></h1>
        <div class="reference-clock">
            <span id="ref-time">00:00:00 AM</span>
            <span id="ref-date">FECHA</span>
        </div>
    </div>

    <div class="switcher-grid">
        <div class="sw-unit">
            <span class="sw-label">LIVE BADGE</span>
            <button class="sw-btn" id="btn-showLive" onclick="toggleBtn('showLive')"><div class="sw-led"></div></button>
        </div>
        <div class="sw-unit">
            <span class="sw-label">LOCATION</span>
            <button class="sw-btn" id="btn-showLocation" onclick="toggleBtn('showLocation')"><div class="sw-led"></div></button>
        </div>
        <div class="sw-unit">
            <span class="sw-label">LOWER THIRD</span>
            <button class="sw-btn" id="btn-showLowerThird" onclick="toggleBtn('showLowerThird')"><div class="sw-led"></div></button>
        </div>
        <div class="sw-unit">
            <span class="sw-label">INFO CENTER</span>
            <button class="sw-btn" id="btn-showInfoCenter" onclick="toggleBtn('showInfoCenter')"><div class="sw-led"></div></button>
        </div>
        <div class="sw-unit">
            <span class="sw-label">TICKER BAR</span>
            <button class="sw-btn" id="btn-showWeather" onclick="toggleBtn('showWeather')"><div class="sw-led"></div></button>
        </div>
        <div class="sw-unit">
            <span class="sw-label">DATE/CLOCK</span>
            <button class="sw-btn" id="btn-showClock" onclick="toggleBtn('showClock')"><div class="sw-led"></div></button>
        </div>
    </div>

    <div class="editor-section">
        <div class="edit-card">
            <h3>Preparación de Textos</h3>
            <label>UBICACIÓN</label>
            <input type="text" id="inputLoc" onkeyup="send('location', this.value)">
            <label>NOMBRE INVITADO</label>
            <input type="text" id="inputLTMain" onkeyup="send('ltMain', this.value)">
            <label>DESCRIPCIÓN</label>
            <input type="text" id="inputLTSub" onkeyup="send('ltSub', this.value)">
        </div>

        <div class="edit-card">
            <h3>Contenido Info Center</h3>
            <label>TÍTULO</label>
            <input type="text" id="inputInfoTitle" onkeyup="send('infoTitle', this.value)">
            <label>CUERPO</label>
            <textarea id="inputInfoBody" onkeyup="send('infoBody', this.value)"></textarea>
        </div>

        <div class="edit-card">
            <h3>Marquesina Adaptable</h3>
            <label>NOTICIAS (SE EXPANDE AL ESCRIBIR)</label>
            <textarea id="inputNews" oninput="autoExpand(this); send('weatherText', this.value)" placeholder="Escribe aquí las noticias..."></textarea>
            
            <div class="color-row">
                <div><label>PRIMARIO</label><input type="color" id="colorPrimary" onchange="send('colorPrimary', this.value)"></div>
                <div><label>ACENTO</label><input type="color" id="colorAccent" onchange="send('colorAccent', this.value)"></div>
            </div>
        </div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

<script>
    const firebaseConfig = { databaseURL: "https://elriveratv-28c69-default-rtdb.firebaseio.com/" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database().ref('overlayData');

    let currentStates = {};

    function send(key, value) { db.update({ [key]: value }); }

    function toggleBtn(key) {
        const newState = currentStates[key] === 'true' ? 'false' : 'true';
        db.update({ [key]: newState });
    }

    // Función para expandir el recuadro de noticias automáticamente
    function autoExpand(field) {
        field.style.height = 'inherit';
        const height = field.scrollHeight;
        field.style.height = height + 'px';
    }

    db.on('value', (snapshot) => {
        const data = snapshot.val() || {};
        currentStates = data;

        updateBtnUI('showLive', data.showLive !== 'false');
        updateBtnUI('showLocation', data.showLocation !== 'false');
        updateBtnUI('showLowerThird', data.showLowerThird === 'true');
        updateBtnUI('showInfoCenter', data.showInfoCenter === 'true');
        updateBtnUI('showWeather', data.showWeather !== 'false');
        updateBtnUI('showClock', data.showClock !== 'false');

        document.getElementById('inputLoc').value = data.location || "";
        document.getElementById('inputLTMain').value = data.ltMain || "";
        document.getElementById('inputLTSub').value = data.ltSub || "";
        document.getElementById('inputInfoTitle').value = data.infoTitle || "";
        document.getElementById('inputInfoBody').value = data.infoBody || "";
        
        // Sincronizar noticias y ajustar altura
        const newsField = document.getElementById('inputNews');
        newsField.value = data.weatherText || "";
        autoExpand(newsField);

        document.getElementById('colorPrimary').value = data.colorPrimary || "#4A148C";
        document.getElementById('colorAccent').value = data.colorAccent || "#E91E63";
    });

    function updateBtnUI(id, isActive) {
        const btn = document.getElementById('btn-' + id);
        if (isActive) btn.classList.add('active');
        else btn.classList.remove('active');
    }

    function updateReference() {
        const now = new Date();
        document.getElementById('ref-time').innerText = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true }).toUpperCase();
        document.getElementById('ref-date').innerText = now.toLocaleDateString('es-MX', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }).toUpperCase();
    }
    
    setInterval(updateReference, 1000);
    updateReference();
</script>
</body>
</html>
