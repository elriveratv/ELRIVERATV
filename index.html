<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@700;900&family=Oswald:wght@300;500;700&display=swap');

        :root {
            --primary: #4A148C;
            --accent: #E91E63;
            --glass: rgba(0, 0, 0, 0.85);
            --white: #ffffff;
        }

        body { 
            background-color: transparent; 
            margin: 0; padding: 0; 
            overflow: hidden; 
            font-family: 'Oswald', sans-serif;
            color: var(--white);
        }

        /* --- GRUPO SUPERIOR (GRANDE CON ANIMACIÓN) --- */
        .top-left-box {
            position: absolute; top: 40px; left: 40px;
            display: flex; flex-direction: column;
            transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);
            width: fit-content;
            z-index: 70;
        }
        .live-row, .date-row { display: flex; align-items: stretch; margin-bottom: 4px; overflow: hidden; width: fit-content; }
        .live-status { background: var(--primary); padding: 8px 25px; font-weight: 700; text-transform: uppercase; font-size: 18px; letter-spacing: 2px; border-left: 8px solid var(--accent); white-space: nowrap; transition: all 0.6s; }
        .location-box { background: var(--glass); padding: 8px 20px; font-size: 18px; font-weight: 400; border-left: 2px solid rgba(255,255,255,0.2); white-space: nowrap; transition: all 0.6s; }
        .temp-box { background: var(--accent); padding: 8px 20px; font-weight: 700; font-size: 18px; border-left: 1px solid rgba(255,255,255,0.3); white-space: nowrap; transition: all 0.6s; }
        .date-box { background: var(--glass); padding: 6px 20px; font-weight: 500; font-size: 16px; border-top: 3px solid var(--accent); white-space: nowrap; transition: all 0.6s; }

        /* --- WIDGET LANZAMIENTO (CON ANIMACIÓN DE ENTRADA) --- */
        #ui-launch-timer { 
            position: absolute; right: 40px; top: 50%; 
            transform: translateY(-50%); background: var(--glass); 
            border-right: 8px solid var(--accent); padding: 20px 30px; 
            text-align: right; transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1); 
            z-index: 40; 
        }
        .mission-name { font-family: 'Montserrat', sans-serif; font-weight: 900; font-size: 14px; color: var(--white); opacity: 0.6; margin-bottom: 5px; text-transform: uppercase; }
        .launch-label { font-family: 'Bebas Neue', cursive; font-size: 22px; color: var(--accent); letter-spacing: 2px; }
        #val-launch-clock { font-family: 'Bebas Neue', cursive; font-size: 70px; line-height: 0.9; color: var(--white); }
        .hold-blink { animation: blink 1s infinite; color: #ffd600 !important; }

        @keyframes blink { 50% { opacity: 0.3; } }

        /* --- LOWER THIRD & INFO CENTER (ANIMACIONES ORIGINALES) --- */
        .lower-third { 
            position: absolute; bottom: 80px; left: 40px; 
            display: flex; flex-direction: column; 
            transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1); 
            z-index: 60; 
        }
        .lt-main { background: var(--primary); padding: 5px 30px; font-family: 'Bebas Neue', cursive; font-size: 35px; border-left: 6px solid var(--accent); width: fit-content; white-space: nowrap; }
        .lt-sub { background: var(--glass); padding: 3px 30px; font-size: 15px; font-weight: 300; text-transform: uppercase; width: fit-content; border-top: 1px solid rgba(255,255,255,0.1); }
        
        .info-center { 
            position: absolute; bottom: 85px; left: 50%; 
            transform: translateX(-50%) scale(1); background: var(--glass); 
            border: 3px solid var(--primary); border-bottom: 8px solid var(--primary); 
            width: 500px; padding: 20px; text-align: center; 
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1); 
            z-index: 50; 
        }
        .ic-title { font-family: 'Bebas Neue', cursive; font-size: 32px; color: var(--accent); margin-bottom: 5px; }
        .ic-body { font-size: 17px; font-weight: 300; color: #efefef; }

        /* --- TICKER DINÁMICO --- */
        .bottom-container { position: absolute; bottom: 0; width: 100%; height: 60px; display: flex; align-items: stretch; z-index: 100; transition: all 0.6s; }
        .brand-label { background: var(--accent); height: 100%; padding: 0 25px; display: flex; align-items: center; font-weight: 900; font-size: 22px; white-space: nowrap; flex-shrink: 0; transition: all 0.6s; }
        .clock-ticker { background: var(--primary); height: 100%; padding: 0 20px; display: flex; align-items: center; justify-content: center; font-family: 'Bebas Neue', cursive; border-right: 3px solid var(--accent); min-width: 140px; transition: all 0.6s; }
        #ui-time-main { font-size: 34px; line-height: 1; margin-right: 8px; }
        
        .ticker-wrapper { flex: 1; height: 100%; background: var(--glass); display: flex; align-items: center; overflow: hidden; transition: all 0.8s; }
        .ticker-content { display: flex; width: max-content; white-space: nowrap; will-change: transform; animation: ticker-loop linear infinite; }
        .ticker-text { padding-right: 80px; font-size: 20px; font-weight: 500; display: inline-block; }

        @keyframes ticker-loop { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }

        /* --- ESTADOS DE OCULTACIÓN (RESTAURADOS) --- */
        .element-hidden { max-width: 0 !important; min-width: 0 !important; padding: 0 !important; opacity: 0 !important; border: none !important; margin: 0 !important; overflow: hidden; }
        .hidden-left { transform: translateX(-110%); opacity: 0; }
        .hidden-right { transform: translateX(110%) translateY(-50%); opacity: 0; }
        .info-hidden { transform: translate(-50%, 30px) scale(0.8); opacity: 0; pointer-events: none; }
        .ticker-only-hidden { transform: translateY(60px); opacity: 0; }
    </style>
</head>
<body>

    <div class="info-center" id="ui-info-center">
        <div class="ic-title" id="val-info-title">INFO CENTER</div>
        <div class="ic-body" id="val-info-body">Cargando información...</div>
    </div>

    <div id="ui-launch-timer" class="hidden-right">
        <div class="mission-name" id="val-mission-name">MISIÓN</div>
        <div class="launch-label" id="val-launch-label">TIEMPO DE LANZAMIENTO</div>
        <div id="val-launch-clock">00:00:00</div>
    </div>

    <div class="lower-third" id="ui-lt-group">
        <div class="lt-main" id="val-lt-main">NOMBRE INVITADO</div>
        <div class="lt-sub" id="val-lt-sub">CARGO O DESCRIPCIÓN</div>
    </div>

    <div class="top-left-box" id="ui-main-group">
        <div class="live-row">
            <div class="live-status" id="ui-live-badge">EN VIVO</div>
            <div class="location-box" id="ui-location-box">TEPIC, NAYARIT</div>
            <div class="temp-box" id="ui-temp-box">--°C</div>
        </div>
        <div class="date-row">
            <div class="date-box" id="ui-date-box">FECHA</div>
        </div>
    </div>

    <div class="bottom-container" id="ui-bottom-bar">
        <div class="brand-label" id="ui-brand">ELRIVERATV</div>
        <div class="clock-ticker" id="ui-clock-box">
            <span id="ui-time-main">00:00:00</span>
            <span id="ui-time-ampm" style="font-size: 16px; opacity: 0.8;">AM</span>
        </div>
        <div class="ticker-wrapper" id="ui-ticker-wrapper">
            <div class="ticker-content" id="ui-ticker-content"></div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = { databaseURL: "https://elriveratv-28c69-default-rtdb.firebaseio.com/" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database().ref('overlayData');

        let lastText = "";
        let launchInterval = null;

        async function updateWeather() {
            try {
                const res = await fetch('https://api.open-meteo.com/v1/forecast?latitude=21.509&longitude=-104.895&current_weather=true');
                const data = await res.json();
                document.getElementById('ui-temp-box').innerText = `${Math.round(data.current_weather.temperature)}°C`;
            } catch (e) { console.error(e); }
        }

        function updateTime() {
            const now = new Date();
            const parts = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true }).split(' ');
            document.getElementById('ui-time-main').innerText = parts[0];
            document.getElementById('ui-time-ampm').innerText = parts[1].toUpperCase();
            document.getElementById('ui-date-box').innerText = now.toLocaleDateString('es-MX', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }).toUpperCase();
        }

        db.on('value', (snapshot) => {
            const data = snapshot.val() || {};
            
            // Aplicar colores con transición
            document.documentElement.style.setProperty('--primary', data.colorPrimary || '#4A148C');
            document.documentElement.style.setProperty('--accent', data.colorAccent || '#E91E63');

            // Visibilidad con clases de animación
            document.getElementById('ui-live-badge').classList.toggle('element-hidden', data.showLive === 'false');
            document.getElementById('ui-location-box').classList.toggle('element-hidden', data.showLocation === 'false');
            document.getElementById('ui-temp-box').classList.toggle('element-hidden', data.showTemp === 'false');
            document.getElementById('ui-date-box').classList.toggle('element-hidden', data.showClock === 'false');
            document.getElementById('ui-brand').classList.toggle('element-hidden', data.showBrand === 'false');
            document.getElementById('ui-clock-box').classList.toggle('element-hidden', data.showTime === 'false');
            document.getElementById('ui-ticker-wrapper').classList.toggle('ticker-only-hidden', data.showWeather === 'false');

            // Lower Third & Info Center
            document.getElementById('ui-lt-group').classList.toggle('hidden-left', data.showLowerThird !== 'true');
            if(data.ltMain) document.getElementById('val-lt-main').innerText = data.ltMain.toUpperCase();
            if(data.ltSub) document.getElementById('val-lt-sub').innerText = data.ltSub.toUpperCase();

            document.getElementById('ui-info-center').classList.toggle('info-hidden', data.showInfoCenter !== 'true');
            if(data.infoTitle) document.getElementById('val-info-title').innerText = data.infoTitle.toUpperCase();
            if(data.infoBody) document.getElementById('val-info-body').innerText = data.infoBody;

            // --- Reloj de Lanzamiento ---
            const timerState = data.timerState || "RUNNING";
            document.getElementById('ui-launch-timer').classList.toggle('hidden-right', data.showLaunchTimer !== 'true');
            document.getElementById('val-mission-name').innerText = (data.missionName || "MISIÓN");
            document.getElementById('val-launch-label').innerText = (data.launchLabelText || "TIEMPO DE LANZAMIENTO");

            const clockEl = document.getElementById('val-launch-clock');
            clockEl.classList.toggle('hold-blink', timerState === "HOLD");

            if (data.launchTarget) {
                const target = new Date(data.launchTarget).getTime();
                if(launchInterval) clearInterval(launchInterval);
                
                launchInterval = setInterval(() => {
                    let diff;
                    if (timerState === "PAUSED") {
                        diff = target - data.pauseTimestamp;
                    } else if (timerState === "HOLD") {
                        return; 
                    } else {
                        diff = target - new Date().getTime();
                    }

                    const abs = Math.abs(diff);
                    const h = String(Math.floor(abs/3600000)).padStart(2,'0');
                    const m = String(Math.floor((abs%3600000)/60000)).padStart(2,'0');
                    const s = String(Math.floor((abs%60000)/1000)).padStart(2,'0');
                    clockEl.innerText = `${diff < 0 ? '+':'-'}${h}:${m}:${s}`;
                }, 1000);
            }

            // Ticker con lógica de repetición restaurada
            const rawText = (data.weatherText || "BIENVENIDOS A ELRIVERATV...").toUpperCase();
            if (rawText !== lastText) {
                lastText = rawText;
                const content = document.getElementById('ui-ticker-content');
                content.innerHTML = '';
                const fullItem = rawText + "  •  ";
                const reps = rawText.length < 20 ? 10 : 4;
                for(let i=0; i<reps; i++) {
                    const s = document.createElement('span'); s.className='ticker-text'; s.innerText=fullItem;
                    content.appendChild(s);
                }
                content.style.animationDuration = `${Math.max(10, (fullItem.length * reps) / 15)}s`;
            }
        });

        setInterval(updateTime, 1000);
        setInterval(updateWeather, 1800000);
        updateTime(); updateWeather();
    </script>
</body>
</html>
